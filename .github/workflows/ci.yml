name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test (H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

  verify-postgres:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agentledger_test
          POSTGRES_USER: agentledger
          POSTGRES_PASSWORD: agentledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentledger -d agentledger_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/agentledger_test
      SPRING_DATASOURCE_USERNAME: agentledger
      SPRING_DATASOURCE_PASSWORD: agentledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B test

  docker:
    name: Docker image and smoke test
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: agentledger:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start stack
        run: |
          cp .env.example .env
          docker compose up -d --no-build --wait --wait-timeout 180
      - name: Smoke test
        run: |
          set -euo pipefail
          base=http://localhost:8080
          curl -fsS "$base/actuator/health" | grep -q '"UP"'
          curl -fsS "$base/api/health" | grep -q '"ok"'
          curl -fsSI "$base/" | grep -qi "content-security-policy"
          curl -fsS -X POST "$base/api/actions" -H 'Content-Type: application/json' \
            -d '{"agent":"ci","action":"Drop table","target":"db:ci","reason":"smoke"}' | grep -q '"blocked"'
          curl -fsS "$base/api/audit/verify" | grep -q '"valid":true'
          test "$(docker inspect --format '{{.Config.User}}' agentledger:local)" = "app:app"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
